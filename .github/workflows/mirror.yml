name: Model mirror

# Every model app/model_mirror.py lists and every wheel install.bat installs must be on the
# Hugging Face mirror with the listed size and SHA-256. Checked weekly, on demand, and when
# those lists change.
on:
  schedule:
    - cron: "23 5 * * 1"  # Mondays, 05:23 UTC
  workflow_dispatch:
  push:
    paths:
      - app/model_mirror.py
      - install.bat
      - tests/test_mirror.py
      - .github/workflows/mirror.yml
  pull_request:
    paths:
      - app/model_mirror.py
      - install.bat
      - tests/test_mirror.py
      - .github/workflows/mirror.yml

permissions:
  contents: read

jobs:
  mirror:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            app/constraints.txt
            tests/requirements.txt

      - name: Install the test packages
        run: python -m pip install -c app/constraints.txt -r tests/requirements.txt

      - name: Check the mirror
        run: python -m pytest tests -m mirror
