name: Tests

# The GPU-free tests in tests/: the patches on the pristine pinned packages, the settings
# checks in app/presets.py, Resume Render and the start-of-render summary in app/render.py,
# model folders, and what the files must agree on. mirror.yml checks the model mirror.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 3.10.11 on Windows, the version install.bat installs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            app/constraints.txt
            tests/requirements.txt

      - name: Install the test packages
        run: python -m pip install -c app/constraints.txt -r tests/requirements.txt

      # The wheels install.bat installs and kornia, about 105 MB. Each run checks them against
      # their SHA-256 and downloads any that changed.
      - uses: actions/cache@v6
        with:
          path: tests/.cache
          key: pristine-packages-${{ hashFiles('install.bat', 'app/constraints.txt') }}
          restore-keys: pristine-packages-

      - name: Run the tests
        run: python -m pytest tests -m "not mirror"
